<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <!-- Replace the src below with the path to your own photo, e.g. "your-photo.jpg" -->
    <img src="ingelaa.jpg" alt="Profile picture" class="avatar" id="profilePic">

    <h1 class="name">Ingela</h1>
    <p class="title">BCA Graduate</p>

    <p class="bio">
      Aspiring developer & data analyst, always learning.
    </p>

    <div class="skills">
  <span class="skill-tag">HTML</span>
  <span class="skill-tag">CSS</span>
  <span class="skill-tag">JavaScript</span>
  <span class="skill-tag">Python</span>
  <span class="skill-tag">SQL</span>
  <span class="skill-tag">Power BI</span>
  <span class="skill-tag">Node.js</span>
  <span class="skill-tag">Flask</span>
    </div>

    <p class="location">📍 India</p>

    <div class="socials">
      <a href="https://github.com/injelas6-png" target="_blank" rel="noopener noreferrer" class="social-link">GitHub</a>
      <a href="https://linkedin.com/in/ingelas" target="_blank" rel="noopener noreferrer" class="social-link">LinkedIn</a>
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=injelas6@gmail.com" target="_blank" rel="noopener noreferrer" class="social-link">Gmail</a>
    </div>

    <button class="follow-btn" id="followBtn">
      <span class="btn-icon" id="followIcon">+</span>
      <span id="followLabel">Follow</span>
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
